<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">IEEE-CIS Fraud Detection</title>
  <desc id="desc">Time-aware fraud detection with XGBoost, showing data size and final temporal validation metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a34"/>
      <stop offset="0.58" stop-color="#172b53"/>
      <stop offset="1" stop-color="#15586a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d1c3"/>
      <stop offset="1" stop-color="#65a8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1090" cy="28" r="180" fill="#4f95dd" opacity="0.13"/>
  <circle cx="90" cy="355" r="175" fill="#3ecaba" opacity="0.06"/>
  <path d="M0 338C160 296 380 375 575 336s398-32 625 18v6H0z" fill="#0a132a" opacity="0.22"/>

  <rect x="64" y="62" width="8" height="102" rx="4" fill="url(#accent)"/>
  <text x="96" y="105" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700">IEEE-CIS Fraud Detection</text>
  <text x="96" y="145" fill="#c7d6ed" font-family="Segoe UI, Arial, sans-serif" font-size="20">Time-Aware Validation · XGBoost · Feature Ablation · Review Capacity</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="208" width="244" height="100" rx="15" fill="#ffffff" fill-opacity="0.115"/>
    <text x="88" y="244" fill="#a8bbd5" font-size="14" font-weight="600">DATASET</text>
    <text x="88" y="283" fill="#ffffff" font-size="29" font-weight="700">590,540</text>

    <rect x="326" y="208" width="244" height="100" rx="15" fill="#ffffff" fill-opacity="0.115"/>
    <text x="350" y="244" fill="#a8bbd5" font-size="14" font-weight="600">ROC-AUC</text>
    <text x="350" y="283" fill="#65b7ff" font-size="29" font-weight="700">0.908</text>

    <rect x="588" y="208" width="244" height="100" rx="15" fill="#ffffff" fill-opacity="0.115"/>
    <text x="612" y="244" fill="#a8bbd5" font-size="14" font-weight="600">PR-AUC</text>
    <text x="612" y="283" fill="#42d2bd" font-size="29" font-weight="700">0.492</text>

    <rect x="850" y="208" width="286" height="100" rx="15" fill="#ffffff" fill-opacity="0.115"/>
    <text x="874" y="244" fill="#a8bbd5" font-size="14" font-weight="600">TOP 5% FRAUD CAPTURE</text>
    <text x="874" y="283" fill="#ffd166" font-size="29" font-weight="700">55.22%</text>
  </g>
</svg>
