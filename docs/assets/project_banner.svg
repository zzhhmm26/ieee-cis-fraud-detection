<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">IEEE-CIS Fraud Detection</title>
  <desc id="desc">A time-aware machine learning fraud detection workflow from transaction features through risk scoring to manual review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="0.62" stop-color="#173e55"/>
      <stop offset="1" stop-color="#145766"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43c5af"/>
      <stop offset="1" stop-color="#6caee8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#03111f" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1128" cy="35" r="165" fill="#5ec7d3" opacity="0.045"/>
  <circle cx="1030" cy="305" r="145" fill="#43c5af" opacity="0.04"/>

  <g transform="translate(68 48)" filter="url(#shadow)">
    <rect x="0" y="34" width="116" height="126" rx="15" fill="#ffffff" fill-opacity="0.095" stroke="#8ed8ee" stroke-opacity="0.48"/>
    <rect x="20" y="56" width="76" height="13" rx="6.5" fill="#79b8dc" opacity="0.88"/>
    <path d="M24 91h66M24 114h45M24 137h58" stroke="#c7edf5" stroke-width="6" stroke-linecap="round" opacity="0.86"/>
    <circle cx="91" cy="137" r="6" fill="#ef7c77"/>
    <text x="58" y="192" text-anchor="middle" fill="#b7dfe8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.5">TRANSACTION</text>

    <path d="M143 97h58" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M190 86l15 11-15 11" fill="none" stroke="#6caee8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="225" y="34" width="126" height="126" rx="15" fill="#ffffff" fill-opacity="0.105" stroke="#86d7c8" stroke-opacity="0.55"/>
    <path d="M288 54l31 12v26c0 22-13 38-31 46-18-8-31-24-31-46V66z" fill="#6caee8" fill-opacity="0.18" stroke="#a7e4f0" stroke-width="2"/>
    <path d="M273 92l10 10 22-25" fill="none" stroke="#43c5af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="288" y="142" text-anchor="middle" fill="#d7f1f4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">RISK SCORE</text>
    <text x="288" y="192" text-anchor="middle" fill="#b7dfe8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.5">XGBOOST</text>

    <path d="M379 97h58" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M426 86l15 11-15 11" fill="none" stroke="#6caee8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="461" y="34" width="150" height="126" rx="15" fill="#ffffff" fill-opacity="0.105" stroke="#8ed8ee" stroke-opacity="0.5"/>
    <path d="M483 114l20-18 19 8 30-35" fill="none" stroke="#6caee8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="552" cy="69" r="6" fill="#ef7c77"/>
    <text x="536" y="99" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">55.2%</text>
    <text x="536" y="128" text-anchor="middle" fill="#b7dfe8" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="0.4">TOP 5% CAPTURE</text>
    <text x="536" y="192" text-anchor="middle" fill="#b7dfe8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.5">REVIEW QUEUE</text>
  </g>

  <g transform="translate(735 76)">
    <text x="0" y="0" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="750" letter-spacing="0.8">IEEE-CIS FRAUD</text>
    <text x="0" y="43" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="750" letter-spacing="0.8">DETECTION</text>
    <rect x="0" y="68" width="340" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="112" fill="#b9e5ee" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="1.3">TIME-AWARE ML  •  XGBOOST RISK SCORING</text>
    <text x="0" y="146" fill="#8fcbd8" font-family="Segoe UI, Arial, sans-serif" font-size="15">FEATURE ABLATION  /  LEAKAGE AUDIT  /  REVIEW CAPACITY</text>
  </g>
</svg>
